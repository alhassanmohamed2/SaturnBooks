version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: saturn_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saturn_books
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saturn_backend
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/uploads
    ports:
      - "8975:80"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: saturn_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - uploads_data:/var/www/html/uploads
    depends_on:
      - backend
      - frontend

  frontend:
    image: node:20-alpine
    container_name: saturn_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    ports:
      - "8974:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api

volumes:
  db_data:
  uploads_data:
