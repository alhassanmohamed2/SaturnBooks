version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: saturn_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saturn_books
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saturn_backend
    volumes:
      - ./backend:/var/www/html
  nginx:
    image: nginx:alpine
    container_name: saturn_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  frontend:
    image: node:20-alpine
    container_name: saturn_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=/api

volumes:
  db_data:
